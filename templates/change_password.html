<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Traceability System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/selection_window.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/kaertech_logo192.png') }}">
</head>
<body class="body">
    <div class="bg-grid"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrap">
                <div class="logo-icon">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <rect width="36" height="36" rx="10" fill="url(#logoGrad)"/>
                        <path d="M10 12h16M10 18h10M10 24h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="27" cy="24" r="4" fill="white" fill-opacity="0.9"/>
                        <path d="M25.5 24l1 1 2-2" stroke="#1a9b3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-main">Change Password</span>
                    <span class="logo-sub">{{ current_user.name }} · {{ current_user.group }}</span>
                </div>
            </div>

            <div class="field-group">
                <label for="old-password">Current Password</label>
                <input type="password" id="old-password" placeholder="Enter current password">
            </div>
            <div class="field-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" placeholder="At least 6 characters">
            </div>
            <div class="field-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat new password">
            </div>

            <button id="change-btn" class="btn-login">Change Password</button>
            <div id="change-status" class="login-status"></div>

            <p class="login-hint">
                <a href="{{ url_for('first_window') if system == 'te' else url_for('second_window') }}"
                   style="color:#4ade80;">← Back to dashboard</a>
            </p>
        </div>
    </div>

    <script>
        const oldIn    = document.getElementById('old-password');
        const newIn    = document.getElementById('new-password');
        const confIn   = document.getElementById('confirm-password');
        const btn      = document.getElementById('change-btn');
        const status   = document.getElementById('change-status');

        function setStatus(msg, ok) {
            status.textContent = msg;
            status.className = 'login-status ' + (ok ? 'ok' : 'err');
        }

        async function doChange() {
            const old_password     = oldIn.value.trim();
            const new_password     = newIn.value.trim();
            const confirm_password = confIn.value.trim();

            if (!old_password || !new_password || !confirm_password) {
                setStatus('All fields are required.', false); return;
            }
            if (new_password !== confirm_password) {
                setStatus('New passwords do not match.', false); return;
            }
            if (new_password.length < 6) {
                setStatus('New password must be at least 6 characters.', false); return;
            }

            btn.disabled = true;
            btn.textContent = 'Saving…';

            try {
                const res  = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password, new_password, confirm_password })
                });
                const data = await res.json();
                setStatus(data.message, data.success);
                if (data.success) {
                    oldIn.value = '';
                    newIn.value = '';
                    confIn.value = '';
                }
            } catch (e) {
                setStatus('Network error. Please try again.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Change Password';
            }
        }

        btn.addEventListener('click', doChange);
        [oldIn, newIn, confIn].forEach(el =>
            el.addEventListener('keydown', e => e.key === 'Enter' && doChange())
        );
    </script>
</body>
</html>
