<!-- process_new_transaction.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Process Transaction — Test Traceability</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/process_new_transaction.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/kaertech_logo192.png') }}">

    <style>
        .multi-upload-zone { margin-top: 8px; }
        .upload-trigger {
            display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
            padding: 7px 14px; border: 1.5px dashed #b0bec5; border-radius: 8px;
            color: #607d8b; font-size: 13px; transition: border-color .2s, color .2s, background .2s;
            user-select: none;
        }
        .upload-trigger:hover { border-color: #3B6D11; color: #3B6D11; background: #f1f8e9; }
        .upload-trigger svg { flex-shrink: 0; }
        .img-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .img-thumb {
            position: relative; width: 74px; height: 60px; border-radius: 6px;
            overflow: hidden; border: 1.5px solid #dde3ea; flex-shrink: 0;
        }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-thumb .btn-rm {
            position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
            border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none;
            cursor: pointer; font-size: 11px; line-height: 18px; text-align: center; padding: 0;
        }
        .img-thumb .btn-rm:hover { background: #c0392b; }
        .file-input-hidden { display: none; }
    </style>
</head>

<body>
    <div class="page-wrap">

        <header class="page-header">
            <div class="header-left">
                <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="10" fill="#3B6D11" />
                    <path d="M10 12h16M10 18h10M10 24h13" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                    <circle cx="27" cy="24" r="4" fill="white" fill-opacity=".9" />
                    <path d="M25.5 24l1 1 2-2" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="header-title">NEW PROCESS TRANSACTION</span>
            </div>
            <div class="header-right" style="display:flex; align-items:center; gap:12px;">
                <span id="logged-in-user" style="font-size:13px; color:#fff; opacity:.85;"></span>
                <button id="btn-logout" class="btn-back" style="background:rgba(255,255,255,.15);">Sign Out</button>
                <a href="{{ url_for('process_window') }}" class="btn-back" id="exit-btn">← Back</a>
            </div>
        </header>

        <main class="form-area" id="main-form-area">
            <form id="process-transaction-form" method="POST" action="{{ url_for('process_new_transaction') }}"
                enctype="multipart/form-data">

                <div class="form-card">

                    <!-- ══ SECTION 1: Asset Information ══ -->
                    <p class="section-title">Asset Information</p>
                    <div class="form-grid form-grid-2">

                        <div class="field-group" id="group-asset-id">
                            <label for="asset_id">Asset ID <span class="hint">e.g. KP-0002374</span></label>
                            <div class="asset-row">
                                <input type="text" id="asset_id" name="asset_id"
                                    placeholder="Enter asset ID…" autocomplete="off" required>
                                <button type="button" id="btn-lookup-asset" class="btn-auth">Look Up</button>
                            </div>
                            <div id="asset-status" class="status-msg hidden"></div>
                        </div>

                        <div class="field-group" id="group-asset-name">
                            <label for="asset_name">Asset Name <span class="hint">auto-filled</span></label>
                            <input type="text" id="asset_name" name="asset_name"
                                placeholder="Auto-filled from asset ID" readonly required>
                        </div>

                        <div class="field-group" id="group-line-no">
                            <label for="line_no">Line No.</label>
                            <input type="text" id="line_no" name="line_no" placeholder="e.g. Line 3" required>
                        </div>

                    </div>

                    <div class="section-divider"></div>

                    <!-- ══ SECTION 2: Failure Details ══ -->
                    <p class="section-title">Failure Details</p>
                    <div class="form-grid form-grid-1">

                        <div class="field-group" id="group-description">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="2"
                                placeholder="Describe the issue or event…" required></textarea>
                        </div>

                        <div class="field-group" id="group-analysis">
                            <label for="analysis">Analysis</label>
                            <textarea id="analysis" name="analysis" rows="2"
                                placeholder="Root cause or analysis findings…" required></textarea>
                            <div class="multi-upload-zone" id="analysis-upload-zone">
                                <input type="file" id="analysis_images_input" name="analysis_images"
                                    accept="image/*" multiple class="file-input-hidden">
                                <div class="img-strip" id="analysis-strip"></div>
                            </div>
                        </div>

                        <!-- corrective_action → action_taken -->
                        <div class="field-group" id="group-action-taken">
                            <label for="action_taken">Corrective Action</label>
                            <textarea id="action_taken" name="action_taken" rows="2"
                                placeholder="Steps taken to correct the problem…" required></textarea>
                        </div>

                        <!-- verification_result → remarks -->
                        <div class="field-group" id="group-remarks">
                            <label for="remarks">Verification Result</label>
                            <input type="text" id="remarks" name="remarks"
                                placeholder="e.g. PASS / FAIL / OK" autocomplete="off" required>
                        </div>

                    </div>

                    <div class="section-divider"></div>

                    <!-- ══ SECTION 3: Timestamps ══ -->
                    <p class="section-title">Timestamps</p>
                    <div class="form-grid form-grid-3">

                        <div class="field-group" id="group-equip-down">
                            <label for="equip_down">Equipment Down</label>
                            <input type="datetime-local" id="equip_down" name="equip_down" required>
                        </div>

                        <!-- repair_start → datetime_start -->
                        <div class="field-group" id="group-datetime-start">
                            <label for="datetime_start">Repair Start</label>
                            <input type="datetime-local" id="datetime_start" name="datetime_start" required>
                        </div>

                        <!-- repair_end → datetime_end -->
                        <div class="field-group" id="group-datetime-end">
                            <label for="datetime_end">Repair End</label>
                            <input type="datetime-local" id="datetime_end" name="datetime_end" required>
                        </div>

                    </div>

                    <div class="section-divider"></div>

                    <!-- ══ SECTION 4: Assignment & Compliance ══ -->
                    <p class="section-title">Assignment &amp; Compliance</p>
                    <div class="form-grid form-grid-2">

                        <!-- troubleshoot_by → pic -->
                        <div class="field-group" id="group-pic">
                            <label for="pic_search">Troubleshoot By <span class="hint">search PE user</span></label>
                            <div class="search-row">
                                <input type="text" id="pic_search" placeholder="Type name or group…"
                                    autocomplete="off">
                                <div id="pic-dropdown" class="search-dropdown hidden"></div>
                            </div>
                            <input type="hidden" id="pic" name="pic" required>
                            <div id="pic-status" class="status-msg hidden"></div>
                        </div>

                        <div class="field-group" id="group-classification">
                            <label for="classification">Classification</label>
                            <select id="classification" name="classification" required>
                                <option value="" disabled selected>Select a classification…</option>
                                <option value="CALIBRATION">Calibration</option>
                                <option value="CORRECTIVE MAINTENANCE">Corrective Maintenance</option>
                                <option value="DEPLOYMENT">Deployment</option>
                                <option value="PREVENTIVE MAINTENANCE">Preventive Maintenance</option>
                                <option value="REPAIR">Repair</option>
                                <option value="SETUP">Setup</option>
                                <option value="START UP">Start Up</option>
                            </select>
                        </div>
                    </div>
 
                    <!-- Form actions -->
                    <div class="form-actions">
                        <button type="submit" id="btn-create" class="btn-create">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                                style="margin-right:6px;vertical-align:-3px">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            Download Report
                        </button>
                        <button id="submit-data" type="button" class="btn-create">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 9 23 4 18 4" />
                                <path d="M23 9L17 3" />
                                <path d="M4 15v4a2 2 0 0 0 2 2h9" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                            Submit Data
                        </button>
                        <a href="{{ url_for('process_window') }}" class="btn-cancel" id="cancel-btn">Cancel</a>
                    </div>

                </div>
            </form>
        </main>

        <div id="download-overlay" class="download-overlay hidden">
            <div class="download-spinner-box">
                <div class="spinner"></div>
                <p class="spinner-text">Generating your Excel report…</p>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/process_new_transaction.js') }}"></script>
</body>
</html>
