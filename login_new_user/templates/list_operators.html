<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — List of Operators</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/manage_users.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/kaertech_logo192.png') }}">
</head>
<body>

<div class="layout">

  <!-- ── Sidebar (same as manage_users) ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Admin<strong> Panel</strong></span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Register Operator
      </a>
      <a href="/admin/users" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
          <line x1="23" y1="11" x2="17" y2="11"></line><line x1="20" y1="8" x2="20" y2="14"></line>
        </svg>
        Manage Authorized Users
      </a>
      <a href="/list_operators" class="nav-item active list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        List of Operators
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="logged-as">
        <span class="logged-label">Signed in as</span>
        <span class="logged-user">{{ session_user }}</span>
      </div>
      <button class="btn-logout" id="logoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">

    <div class="page-header">
      <div>
        <div class="admin-badge">Admin Panel</div>
        <h1>List of <span>Operators</span></h1>
        <p class="subtitle">All registered operators in the system.</p>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="search-input" placeholder="Search name, EN, process…"
          style="padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; width:220px;">
        <button id="export-btn" style="padding:8px 14px; background:#3B6D11; color:#fff; border:none; border-radius:8px; font-size:13px; cursor:pointer;">
          Export CSV
        </button>
      </div>
    </div>

    <div class="card table-card">
      <div class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Registered Operators
        <span class="user-count" id="opCount">—</span>
      </div>

      <div class="table-wrap">
        <table id="opTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Operator EN</th>
              <th>Employee Name</th>
              <th>Date Hired</th>
              <th>Status</th>
              <th>Contact</th>
              <th>Process</th>
            </tr>
          </thead>
          <tbody id="opBody">
            <tr class="loading-row">
              <td colspan="7">
                <span class="loader"></span> Loading operators…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div id="toast">
  <span class="toast-icon">✓</span>
  <span id="toastMsg"></span>
</div>

<script>
  let allOperators = [];

  async function loadOperators() {
    try {
      const res  = await fetch('/api/admin/operators');
      if (res.status === 403) { window.location.href = '/'; return; }
      const json = await res.json();
      allOperators = json.operators || [];
      renderTable(allOperators);
    } catch {
      document.getElementById('opBody').innerHTML =
        `<tr><td colspan="7" style="text-align:center;color:#e53e3e;padding:2rem">Failed to load operators.</td></tr>`;
    }
  }

  function formatDate(val) {
    if (!val) return '—';
    // handles "YYYY-MM-DD" or datetime strings
    return String(val).split('T')[0];
  }

  function renderTable(data) {
    document.getElementById('opCount').textContent = data.length;
    const tbody = document.getElementById('opBody');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#a0aec0;padding:2rem">No operators found.</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map((op, i) => `
      <tr class="fade-in" style="animation-delay:${i * 30}ms">
        <td class="col-idx">${i + 1}</td>
        <td class="col-num">${op.operator_en || '—'}</td>
        <td class="col-name">${op.employee_name || '—'}</td>
        <td>${formatDate(op.date_hired)}</td>
        <td><span class="badge ${op.status?.toLowerCase() === 'regular' ? 'badge-admin' : 'badge-user'}">${op.status || '—'}</span></td>
        <td>${op.contact || '—'}</td>
        <td>${op.process || '—'}</td>
      </tr>`).join('');
  }

  // Search
  document.getElementById('search-input').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    const filtered = allOperators.filter(op =>
      (op.operator_en   || '').toLowerCase().includes(q) ||
      (op.employee_name || '').toLowerCase().includes(q) ||
      (op.process       || '').toLowerCase().includes(q) ||
      (op.status        || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
  });

  // Export CSV
  document.getElementById('export-btn').addEventListener('click', () => {
    const rows  = [['#','Operator EN','Employee Name','Date Hired','Status','Contact','Process']];
    allOperators.forEach((op, i) => {
      rows.push([
        i + 1,
        op.operator_en   || '',
        op.employee_name || '',
        formatDate(op.date_hired),
        op.status        || '',
        op.contact       || '',
        op.process       || '',
      ]);
    });
    const csv  = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'operators.csv'; a.click();
    URL.revokeObjectURL(url);
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  });

  loadOperators();
</script>
</body>
</html>
